name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.4']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer lint
      - run: composer phpcs
      - run: composer test

  playground:
    runs-on: ubuntu-latest
    needs: php
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Smoke test in WordPress and WooCommerce
        run: >-
          npx --yes @wp-playground/cli@3.1.50 php
          --mount=.:/wordpress/wp-content/plugins/destinx-ai-commerce
          --blueprint=tests/playground-blueprint.json
          -- /wordpress/wp-content/plugins/destinx-ai-commerce/tests/playground-smoke.php

      - name: Smoke test the Multisite lifecycle
        run: >-
          npx --yes @wp-playground/cli@3.1.50 php
          --site-url=http://localhost
          --mount=.:/wordpress/wp-content/plugins/destinx-ai-commerce
          --blueprint=tests/playground-multisite-blueprint.json
          -- /wordpress/wp-content/plugins/destinx-ai-commerce/tests/playground-multisite-smoke.php

  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the WordPress.org distribution directory
        run: |
          mkdir -p build/destinx-ai-commerce
          git archive --format=tar HEAD \
            LICENSE.md \
            assets \
            composer.json \
            destinx-ai-commerce.php \
            includes \
            languages \
            readme.txt \
            uninstall.php \
            | tar -x -C build/destinx-ai-commerce
      - name: Run official Plugin Check
        uses: wordpress/plugin-check-action@v1.1.9
        with:
          build-dir: './build/destinx-ai-commerce'
          include-experimental: false
          slug: destinx-ai-commerce

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.4']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer lint
      - run: composer phpcs
      - run: composer test

  playground:
    runs-on: ubuntu-latest
    needs: php
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Smoke test in WordPress and WooCommerce
        run: >-
          npx --yes @wp-playground/cli@3.1.50 php
          --mount=.:/wordpress/wp-content/plugins/destinx-ai-commerce
          --blueprint=tests/playground-blueprint.json
          -- /wordpress/wp-content/plugins/destinx-ai-commerce/tests/playground-smoke.php

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.4']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer lint
      - run: composer phpcs
      - run: composer test

  playground:
    runs-on: ubuntu-latest
    needs: php
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Smoke test in WordPress and WooCommerce
        run: >-
          npx --yes @wp-playground/cli@3.1.50 php
          --mount=.:/wordpress/wp-content/plugins/destinx-ai-commerce
          --blueprint=tests/playground-blueprint.json
          -- /wordpress/wp-content/plugins/destinx-ai-commerce/tests/playground-smoke.php

      - name: Smoke test the Multisite lifecycle
        run: >-
          npx --yes @wp-playground/cli@3.1.50 php
          --site-url=http://localhost
          --mount=.:/wordpress/wp-content/plugins/destinx-ai-commerce
          --blueprint=tests/playground-multisite-blueprint.json
          -- /wordpress/wp-content/plugins/destinx-ai-commerce/tests/playground-multisite-smoke.php

  compatibility:
    runs-on: ubuntu-latest
    needs: php
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Minimum supported
            blueprint: tests/playground-minimum-blueprint.json
            wordpress: '6.6'
            woocommerce: '8.2.5'
          - label: Previous WooCommerce major
            blueprint: tests/playground-previous-woo-blueprint.json
            wordpress: '7.1'
            woocommerce: '10.9.4'
    name: compatibility (${{ matrix.label }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Run the full compatibility smoke test
        run: >-
          npx --yes @wp-playground/cli@3.1.50 php
          --define DXAIC_EXPECTED_WP ${{ matrix.wordpress }}
          --define DXAIC_EXPECTED_WC ${{ matrix.woocommerce }}
          --mount=.:/wordpress/wp-content/plugins/destinx-ai-commerce
          --blueprint=${{ matrix.blueprint }}
          -- /wordpress/wp-content/plugins/destinx-ai-commerce/tests/playground-smoke.php

  pricing-compatibility:
    runs-on: ubuntu-latest
    needs: php
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Test real quote-pricing integrations
        run: >-
          npx --yes @wp-playground/cli@3.1.50 php
          --mount=.:/wordpress/wp-content/plugins/destinx-ai-commerce
          --blueprint=tests/playground-pricing-compatibility-blueprint.json
          -- /wordpress/wp-content/plugins/destinx-ai-commerce/tests/playground-pricing-compatibility-smoke.php

  scale:
    runs-on: ubuntu-latest
    needs: php
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Test catalogs through 5,000 products
        run: >-
          npx --yes @wp-playground/cli@3.1.50 php
          --mount=.:/wordpress/wp-content/plugins/destinx-ai-commerce
          --blueprint=tests/playground-blueprint.json
          -- /wordpress/wp-content/plugins/destinx-ai-commerce/tests/playground-scale-smoke.php

  upgrade-lifecycle:
    runs-on: ubuntu-latest
    needs: php
    strategy:
      fail-fast: false
      matrix:
        previous: ['v0.6.0', 'v0.7.0']
    name: upgrade lifecycle (${{ matrix.previous }})
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Build the previous release fixture
        run: |
          mkdir -p build/previous/destinx-ai-commerce
          git archive --format=tar ${{ matrix.previous }} \
            LICENSE.md \
            assets \
            composer.json \
            destinx-ai-commerce.php \
            includes \
            readme.txt \
            uninstall.php \
            | tar -x -C build/previous/destinx-ai-commerce
      - name: Update, deactivate, and reactivate without data loss
        run: >-
          npx --yes @wp-playground/cli@3.1.50 php
          --mount=build/previous/destinx-ai-commerce:/wordpress/wp-content/plugins/destinx-ai-commerce
          --mount=.:/wordpress/dxaic-current
          --blueprint=tests/playground-upgrade-blueprint.json
          -- /wordpress/dxaic-current/tests/playground-upgrade-smoke.php

  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the WordPress.org distribution directory
        run: |
          mkdir -p build/destinx-ai-commerce
          git archive --format=tar HEAD \
            LICENSE.md \
            assets \
            composer.json \
            destinx-ai-commerce.php \
            includes \
            languages \
            readme.txt \
            uninstall.php \
            | tar -x -C build/destinx-ai-commerce
      - name: Run official Plugin Check
        uses: wordpress/plugin-check-action@v1.1.9
        with:
          build-dir: './build/destinx-ai-commerce'
          include-experimental: false
          slug: destinx-ai-commerce
          strict: true
